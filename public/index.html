<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Almoxarifado</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script src="/js/comum.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body><main>
  <h1>Almoxarifado</h1>
  <h2>Entrar</h2>
  <form id="login">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <div><button type="submit">Entrar</button></div>
  </form>
  <p id="mensagem" class="mensagem" role="status"></p>
  <details>
    <summary>Cadastrar operador</summary>
    <form id="cadastro">
      <label for="novo-nome">Nome</label>
      <input id="novo-nome" name="nome" maxlength="100" required>
      <label for="novo-email">E-mail</label>
      <input id="novo-email" name="email" type="email" autocomplete="username" required>
      <label for="nova-senha">Senha (mínimo de 6 caracteres)</label>
      <input id="nova-senha" name="senha" type="password" autocomplete="new-password" minlength="6" required>
      <div><button type="submit">Cadastrar</button></div>
    </form>
    <p id="cadastro-mensagem" class="mensagem" role="status"></p>
  </details>
</main></body>
</html>
