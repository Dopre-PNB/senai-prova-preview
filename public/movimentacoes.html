<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimentações - Almoxarifado</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script src="/js/comum.js" defer></script>
  <script src="/js/movimentacoes.js" defer></script>
</head>
<body><main>
  <h1>Movimentações</h1>
  <nav aria-label="Menu">
    <a href="/painel.html">Início</a>
    <a href="/produtos.html">Produtos</a>
    <a href="/movimentacoes.html">Movimentações</a>
    <a href="/usuarios.html" data-admin hidden>Usuários</a>
    <button id="sair" type="button">Sair</button>
  </nav>
  <p id="usuario"></p>
  <h2>Registrar movimentação</h2>
  <form id="movimentacao">
    <label for="produto-id">Produto</label>
    <select id="produto-id" name="produto_id" required></select>
    <label for="tipo">Tipo</label>
    <select id="tipo" name="tipo"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" name="quantidade" type="number" min="1" step="1" required>
    <div><button id="registrar" type="submit">Registrar</button></div>
  </form>
  <p id="mensagem" class="mensagem" role="status"></p>
  <h2>Histórico</h2>
  <button id="atualizar" type="button">Atualizar</button>
  <div class="tabela">
    <table>
      <thead><tr><th>ID</th><th>Data e hora</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Responsável</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
</main></body>
</html>
