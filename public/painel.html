<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel - Almoxarifado</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script src="/js/comum.js" defer></script>
  <script src="/js/painel.js" defer></script>
</head>
<body><main>
  <h1>Almoxarifado</h1>
  <nav aria-label="Menu">
    <a href="/painel.html">Início</a>
    <a href="/produtos.html">Produtos</a>
    <a href="/movimentacoes.html">Movimentações</a>
    <a href="/usuarios.html" data-admin hidden>Usuários</a>
    <button id="sair" type="button">Sair</button>
  </nav>
  <p id="usuario"></p>
  <p>Use o menu para consultar produtos e registrar entradas ou saídas.</p>
  <h2>Meus dados</h2>
  <form id="perfil">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" maxlength="100" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <label for="senha">Nova senha (deixe em branco para manter)</label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6">
    <div><button type="submit">Salvar</button></div>
  </form>
  <p id="mensagem" class="mensagem" role="status"></p>
</main></body>
</html>
