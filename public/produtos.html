<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos - Almoxarifado</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <script src="/js/comum.js" defer></script>
  <script src="/js/produtos.js" defer></script>
</head>
<body><main>
  <h1>Produtos</h1>
  <nav aria-label="Menu">
    <a href="/painel.html">Início</a>
    <a href="/produtos.html">Produtos</a>
    <a href="/movimentacoes.html">Movimentações</a>
    <a href="/usuarios.html" data-admin hidden>Usuários</a>
    <button id="sair" type="button">Sair</button>
  </nav>
  <p id="usuario"></p>
  <h2 id="form-titulo">Cadastrar produto</h2>
  <form id="produto">
    <input id="produto-id" type="hidden">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" maxlength="100" required>
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" required></textarea>
    <p>O saldo começa em zero. Registre uma entrada na tela de movimentações.</p>
    <button type="submit">Salvar produto</button>
    <button id="cancelar" type="button" hidden>Cancelar edição</button>
  </form>
  <p id="mensagem" class="mensagem" role="status"></p>
  <h2>Consultar produtos</h2>
  <form id="filtro" class="linha">
    <div><label for="filtro-nome">Nome</label><input id="filtro-nome" name="nome" type="search"></div>
    <div><label for="filtro-data">Cadastrados a partir de</label><input id="filtro-data" name="data" type="date"></div>
    <button type="submit">Buscar</button>
    <button id="limpar" type="button">Limpar</button>
  </form>
  <div class="tabela">
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Saldo</th><th>Cadastro</th><th>Ações</th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
  <button id="anterior" type="button">Anterior</button>
  <span id="pagina">Página 1</span>
  <button id="proxima" type="button">Próxima</button>
</main></body>
</html>
